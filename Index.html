<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuites – vos abonnements, ce qu'ils coûtent vraiment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#eef3f6;--surface:#fff;--ink:#12304a;--muted:#5d7388;--line:#d3dde5;--warn:#b86e00;--warnbg:#fff1d6;--cut:#b8281f;--cutbg:#fde6e3;--accent:#12304a;--accentink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b27;--surface:#16293a;--ink:#e6eef5;--muted:#93a9bc;--line:#27415a;--warn:#f0b04a;--warnbg:#3a2c10;--cut:#ff8a80;--cutbg:#3d1d1b;--accent:#e6eef5;--accentink:#0e1b27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b27;--surface:#16293a;--ink:#e6eef5;--muted:#93a9bc;--line:#27415a;--warn:#f0b04a;--warnbg:#3a2c10;--cut:#ff8a80;--cutbg:#3d1d1b;--accent:#e6eef5;--accentink:#0e1b27;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.hero{padding:6px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.big{font-size:clamp(3rem,16vw,4.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.35em;font-weight:600;letter-spacing:0;margin-left:6px;color:var(--muted)}
.lead{margin:6px 0 0;color:var(--muted)}
.cut{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--cutbg);color:var(--cut);font-weight:600;display:none}
.alerts{margin:0 0 18px;display:none}
.alerts h2,.list h2,.add h2{font-size:1rem;margin:0 0 8px;font-weight:800}
.alert{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--warnbg);color:var(--warn);border-radius:6px;margin-bottom:6px;font-weight:600}
.add{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.full{grid-column:1/-1}
.btn{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border-radius:6px;border:0;background:var(--accent);color:var(--accentink);cursor:pointer;width:100%}
.err{color:var(--cut);font-size:.88rem;min-height:1.2em;margin:6px 0 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.item.off{border-color:var(--cut)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}
.item.off .name{text-decoration:line-through}
.price{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.acts{display:flex;gap:8px}
.acts button{font:inherit;font-size:.88rem;min-height:40px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.acts .on{background:var(--cutbg);color:var(--cut);border-color:var(--cut);font-weight:700}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:8px}
@media (prefers-reduced-motion:no-preference){.big{transition:opacity .2s}}
</style>
</head>
<body>
<main>
  <h1>Fuites</h1>
  <p class="sub">Vos abonnements, ce qu'ils coûtent vraiment.</p>

  <section class="hero" aria-live="polite">
    <div class="big"><span id="annual">0</span><small>€ / an</small></div>
    <p class="lead" id="lead">Ajoutez votre premier abonnement.</p>
    <div class="cut" id="cut"></div>
  </section>

  <section class="alerts" id="alerts"><h2>À renouveler sous 7 jours</h2><div id="alertList"></div></section>

  <section class="add">
    <h2>Ajouter un abonnement</h2>
    <div class="row">
      <div class="full"><label for="n">Nom</label><input id="n" placeholder="Ex. Netflix, salle de sport" maxlength="60" autocomplete="off"></div>
      <div><label for="p">Prix (€)</label><input id="p" type="number" inputmode="decimal" min="0" step="0.01" placeholder="9,99"></div>
      <div><label for="f">Fréquence</label><select id="f"><option value="m">Chaque mois</option><option value="y">Chaque année</option></select></div>
      <div class="full"><label for="d">Prochain prélèvement</label><input id="d" type="date"></div>
    </div>
    <button class="btn" id="add" type="button">Ajouter</button>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section class="list"><h2>Mes abonnements</h2><div id="list"></div></section>
</main>
<script>
(function(){
var KEY='fuites:v1', items=[];
function load(){try{var r=localStorage.getItem(KEY);items=r?JSON.parse(r):[];if(!Array.isArray(items))items=[]}catch(e){items=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
var eur0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function nextDate(it){
  var d=parse(it.date),t=today(),g=0;
  while(d<t&&g++<600){if(it.f==='m')d=new Date(d.getFullYear(),d.getMonth()+1,d.getDate());else d=new Date(d.getFullYear()+1,d.getMonth(),d.getDate())}
  return d}
function annual(it){return it.f==='m'?it.p*12:it.p}
function days(d){return Math.round((d-today())/864e5)}
function fmt(d){return d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}
function when(n){return n===0?"aujourd'hui":n===1?'demain':'dans '+n+' jours'}
function render(){
  var tot=0,cutTot=0;
  items.forEach(function(it){tot+=annual(it);if(it.cut)cutTot+=annual(it)});
  $('annual').textContent=eur0.format(Math.round(tot));
  $('lead').textContent=items.length?('Soit '+eur.format(tot/12)+' par mois, pour '+items.length+' abonnement'+(items.length>1?'s':'')+'.'):'Ajoutez votre premier abonnement.';
  var c=$('cut');
  if(cutTot>0){c.style.display='block';c.textContent='En résiliant ceux que vous avez marqués, vous gardez '+eur.format(cutTot)+' par an.'}else c.style.display='none';
  var sorted=items.map(function(it){return{it:it,nd:nextDate(it)}}).sort(function(a,b){return a.nd-b.nd});
  var soon=sorted.filter(function(x){return days(x.nd)<=7});
  $('alerts').style.display=soon.length?'block':'none';
  $('alertList').innerHTML=soon.map(function(x){return'<div class="alert"><span>'+esc(x.it.n)+' – '+when(days(x.nd))+'</span><span>'+eur.format(x.it.p)+'</span></div>'}).join('');
  if(!sorted.length){$('list').innerHTML='<div class="empty">Rien ici pour le moment. Listez tout ce qui est prélevé automatiquement : streaming, appli, salle de sport, assurance.</div>';return}
  $('list').innerHTML=sorted.map(function(x){var it=x.it;
    return'<div class="item'+(it.cut?' off':'')+'"><div class="top"><span class="name">'+esc(it.n)+'</span><span class="price">'+eur.format(it.p)+(it.f==='m'?' / mois':' / an')+'</span></div>'
    +'<div class="meta">Prochain prélèvement le '+fmt(x.nd)+' · '+eur.format(annual(it))+' par an</div>'
    +'<div class="acts"><button type="button" data-a="cut" data-id="'+it.id+'" class="'+(it.cut?'on':'')+'" aria-pressed="'+(!!it.cut)+'">'+(it.cut?'À résilier ✓':'Marquer à résilier')+'</button>'
    +'<button type="button" data-a="del" data-id="'+it.id+'">Supprimer</button></div></div>'}).join('');
}
$('add').addEventListener('click',function(){
  var n=$('n').value.trim(),p=parseFloat($('p').value.replace(',','.')),d=$('d').value,f=$('f').value,e=$('err');
  if(!n){e.textContent='Saisissez le nom de l\'abonnement.';return}
  if(!(p>=0)||isNaN(p)){e.textContent='Saisissez un prix valide, par exemple 9,99.';return}
  if(!d){e.textContent='Choisissez la date du prochain prélèvement.';return}
  e.textContent='';
  items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),n:n,p:p,f:f,date:d,cut:false});
  save();$('n').value='';$('p').value='';$('d').value='';render();
});
$('list').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  var id=b.getAttribute('data-id'),a=b.getAttribute('data-a');
  if(a==='del')items=items.filter(function(i){return i.id!==id});
  if(a==='cut')items.forEach(function(i){if(i.id===id)i.cut=!i.cut});
  save();render();
});
load();render();
})();
</script>
</body>
</html>
